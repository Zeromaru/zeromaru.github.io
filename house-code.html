<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Upgrade Code Generator</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #fff;
    --line: #e3e5e9;
    --text: #1d2025;
    --muted: #6b7280;
    --accent: #2f7d32;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .head h2 { font-size: 15px; margin: 0; }
  .tag {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: var(--muted);
  }
  .tag b { color: var(--accent); font-size: 14px; }
  select {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    font-family: ui-monospace, monospace;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 14px; }
  label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; font-size: 14px; }
  label code { color: var(--muted); font-size: 12px; min-width: 20px; }
  .all { font-weight: 600; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
  .fixed { font-family: ui-monospace, monospace; color: var(--muted); font-size: 14px; }
  #out {
    display: block;
    width: 100%;
    background: #16181d;
    color: #5ee08a;
    padding: 16px;
    border: 0;
    border-radius: 10px;
    font-family: ui-monospace, monospace;
    font-size: 16px;
    line-height: 1.7;
    white-space: pre;
    overflow-x: auto;
    resize: none;
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; min-height: 18px; }
  .bar { display: flex; gap: 8px; margin-top: 10px; }
  button {
    padding: 10px 16px;
    font-size: 15px;
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary.done { background: #555; border-color: #555; }
</style>
</head>
<body>

<h1>House Upgrade Code Generator</h1>
<p class="sub">Harvest Moon: More Friends of Mineral Town &mdash; CodeBreaker</p>

<div id="form"></div>

<textarea id="out" rows="3" readonly inputmode="none" spellcheck="false"
  autocapitalize="off" autocorrect="off"></textarea>
<div class="bar">
  <button id="copy" class="primary" type="button">Copy code</button>
  <button id="reset" type="button">Reset</button>
</div>
<p id="hint" class="hint"></p>

<script>
// Each field is one hex byte.
// select = pick one value, flags = base OR'd with every checked bit, fixed = constant.
const FIELDS = [
  { key: "uu", label: "House Expansion", type: "select", options: [
    { v: 0x00, label: "Default" },
    { v: 0x01, label: "1st House Expansion" },
    { v: 0x02, label: "2nd House Expansion" },
  ]},
  { key: "vv", label: "House Items", type: "flags", base: 0x00, options: [
    { v: 0x01, label: "Bathroom" },
    { v: 0x02, label: "Refrigerator" },
    { v: 0x04, label: "Cupboard" },
    { v: 0x08, label: "Music Player" },
    { v: 0x10, label: "Large Bed" },
    { v: 0x20, label: "Carpet" },
    { v: 0x40, label: "Vase" },
  ]},
  { key: "ww", label: "Reserved", type: "fixed", value: 0x35 },
  { key: "xx", label: "Decorations", type: "flags", base: 0x81, options: [
    { v: 0x08, label: "Mirror" },
    { v: 0x10, label: "Clock" },
    { v: 0x20, label: "Socks" },
  ]},
  { key: "yy", label: "Special State", type: "select", options: [
    { v: 0x1A, label: "Default" },
    { v: 0x3A, label: "Something in socks (but cannot take out)" },
    { v: 0x5A, label: "Fireplace has a fire" },
    { v: 0x9A, label: "Kitchen" },
  ]},
  { key: "zz", label: "Kitchen Tools", type: "flags", base: 0x00, options: [
    { v: 0x01, label: "Knife" },
    { v: 0x02, label: "Frying Pan" },
    { v: 0x04, label: "Pot" },
    { v: 0x08, label: "Mixer" },
    { v: 0x10, label: "Whisk" },
    { v: 0x20, label: "Rolling Pin" },
    { v: 0x40, label: "Oven" },
    { v: 0x80, label: "Seasoning Set" },
  ]},
];

// [address, high byte, low byte]
const LINES = [
  ["82005000", "vv", "uu"],
  ["82005002", "xx", "ww"],
  ["82005004", "zz", "yy"],
];

const hex = v => (v & 0xFF).toString(16).toUpperCase().padStart(2, "0");
const allOf = f => f.options.reduce((acc, o) => acc | o.v, f.base);

const buildCode = state => LINES
  .map(([addr, hi, lo]) => addr + " " + hex(state[hi]) + hex(state[lo]))
  .join("\n");

const state = {};
const tags = {};
const out = document.getElementById("out");

function update() {
  for (const f of FIELDS) tags[f.key].innerHTML = f.key.toUpperCase() + " = <b>" + hex(state[f.key]) + "</b>";
  out.value = buildCode(state);
}

function buildSelect(f) {
  state[f.key] = f.options[0].v;
  const el = document.createElement("select");
  for (const o of f.options) el.add(new Option(hex(o.v) + "  " + o.label, o.v));
  el.addEventListener("change", () => { state[f.key] = Number(el.value); update(); });
  return [el];
}

function buildFlags(f) {
  state[f.key] = f.base;
  const boxes = [];
  const row = (box, text, cls) => {
    const l = document.createElement("label");
    if (cls) l.className = cls;
    const code = document.createElement("code");
    l.append(box, code, text);
    return [l, code];
  };

  const grid = document.createElement("div");
  grid.className = "opts";
  for (const o of f.options) {
    const box = document.createElement("input");
    box.type = "checkbox";
    box.addEventListener("change", () => {
      state[f.key] = box.checked ? state[f.key] | o.v : state[f.key] & ~o.v;
      syncAll();
      update();
    });
    boxes.push(box);
    const [l, code] = row(box, o.label);
    code.textContent = hex(o.v);
    grid.appendChild(l);
  }

  const allBox = document.createElement("input");
  allBox.type = "checkbox";
  allBox.addEventListener("change", () => {
    boxes.forEach(b => { b.checked = allBox.checked; });
    state[f.key] = allBox.checked ? allOf(f) : f.base;
    update();
  });
  const [allLabel, allCode] = row(allBox, "All", "all");
  allCode.textContent = hex(allOf(f));

  function syncAll() { allBox.checked = state[f.key] === allOf(f); }

  return [grid, allLabel];
}

const form = document.getElementById("form");
for (const f of FIELDS) {
  const card = document.createElement("div");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "head";
  const title = document.createElement("h2");
  title.textContent = f.label;
  const tag = document.createElement("span");
  tag.className = "tag";
  tags[f.key] = tag;
  head.append(title, tag);
  card.appendChild(head);

  if (f.type === "fixed") {
    state[f.key] = f.value;
    const note = document.createElement("div");
    note.className = "fixed";
    note.textContent = hex(f.value) + "  Default (fixed)";
    card.appendChild(note);
  } else {
    card.append(...(f.type === "select" ? buildSelect(f) : buildFlags(f)));
  }
  form.appendChild(card);
}

// Neither file:// nor content:// (what Android uses when a file manager opens
// this page) is a secure context, so navigator.clipboard is missing there.
// Fall back to execCommand on the output field, and if that also fails, leave the
// code selected so the user can copy it from the long-press menu.
function copyText() {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(out.value).catch(execCopy);
  }
  return execCopy();
}

// A hidden textarea is ignored by most mobile browsers, so copy from the visible
// one. iOS also ignores a selection in a read-only field, hence the toggle.
function execCopy() {
  out.readOnly = false;
  selectOutput();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  out.readOnly = true;
  return ok ? Promise.resolve() : Promise.reject();
}

function selectOutput() {
  out.focus({ preventScroll: true });
  out.setSelectionRange(0, out.value.length);
}

// Tapping the code selects all of it, so a long-press menu copies every line.
out.addEventListener("focus", () => out.setSelectionRange(0, out.value.length));

const copyBtn = document.getElementById("copy");
const hint = document.getElementById("hint");
copyBtn.addEventListener("click", () => {
  function flash(msg, ms) {
    copyBtn.textContent = msg;
    setTimeout(() => {
      copyBtn.textContent = "Copy code";
      copyBtn.classList.remove("done");
    }, ms || 1500);
  }
  copyText()
    .then(() => {
      out.blur();
      hint.textContent = "";
      copyBtn.classList.add("done");
      flash("Copied!");
    })
    .catch(() => {
      selectOutput();
      hint.textContent = "Copy blocked here. The code is selected \u2014 long-press it and tap Copy.";
      flash("Long-press to copy", 3000);
    });
});

document.getElementById("reset").addEventListener("click", () => {
  form.querySelectorAll("input[type=checkbox]").forEach(b => { b.checked = false; });
  form.querySelectorAll("select").forEach(s => { s.selectedIndex = 0; });
  for (const f of FIELDS) {
    if (f.type === "flags") state[f.key] = f.base;
    else if (f.type === "select") state[f.key] = f.options[0].v;
  }
  hint.textContent = "";
  update();
});

update();
</script>

</body>
</html>
